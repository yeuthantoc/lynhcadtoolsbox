name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        acad: ["2023"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Core checks
        run: dotnet run --project tools/LynhCad.Manhole.Preview -- check

      - name: Build bundle for AutoCAD ${{ matrix.acad }}
        shell: pwsh
        run: .\build.ps1 -Acad ${{ matrix.acad }}

      - uses: actions/upload-artifact@v4
        with:
          name: LynhCadToolsBox-AutoCAD${{ matrix.acad }}
          path: dist/
