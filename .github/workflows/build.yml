name: Build plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        acad: ["2023"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Core checks
        run: dotnet run --project tools/LynhCad.Manhole.Preview -- check

      - name: Build bundle for AutoCAD ${{ matrix.acad }}
        shell: pwsh
        run: .\build.ps1 -Acad ${{ matrix.acad }}

      # LCT_RELOAD cần URI của XAML có phiên bản (WPF cache theo tên;phiên bản), nếu không sẽ mở hộp thoại của bản cũ
      - name: Check XAML resource URI carries the assembly version
        shell: pwsh
        run: |
          $g = Get-ChildItem src/LynhCad.Manhole.Plugin/obj -Recurse -Filter ManholeWindow.g.cs | Select-Object -First 1
          Select-String -Path $g.FullName -Pattern 'component/' | ForEach-Object { $_.Line.Trim() }
          if (-not (Select-String -Path $g.FullName -Pattern ';V0\.1\.' -Quiet)) { throw "XAML URI has no assembly version" }

      - uses: actions/upload-artifact@v4
        with:
          name: LynhCadToolsBox-AutoCAD${{ matrix.acad }}
          path: dist/

      # Bản build trên main được đăng lên release "latest" để install-acad2023.ps1 tải về (không cần đăng nhập GitHub)
      - name: Publish to release "latest"
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "LynhCadToolsBox-AutoCAD${{ matrix.acad }}.zip"
          Compress-Archive -Path dist\LynhCadToolsBox.bundle -DestinationPath $zip -Force
          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --target main --title "Latest build" --notes "Bản build tự động mới nhất từ main. Cài bằng install-acad2023.ps1."
          }
          gh release upload latest $zip --clobber
