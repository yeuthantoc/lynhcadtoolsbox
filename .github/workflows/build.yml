name: Build plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        acad: ["2023"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Core checks
        run: dotnet run --project tools/LynhCad.Manhole.Preview -- check

      - name: Build bundle for AutoCAD ${{ matrix.acad }}
        shell: pwsh
        run: .\build.ps1 -Acad ${{ matrix.acad }}

      - uses: actions/upload-artifact@v4
        with:
          name: LynhCadToolsBox-AutoCAD${{ matrix.acad }}
          path: dist/

      # Bản build trên main được đăng lên release "latest" để install-acad2023.ps1 tải về (không cần đăng nhập GitHub)
      - name: Publish to release "latest"
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "LynhCadToolsBox-AutoCAD${{ matrix.acad }}.zip"
          Compress-Archive -Path dist\LynhCadToolsBox.bundle -DestinationPath $zip -Force
          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --target main --title "Latest build" --notes "Bản build tự động mới nhất từ main. Cài bằng install-acad2023.ps1."
          }
          gh release upload latest $zip --clobber
